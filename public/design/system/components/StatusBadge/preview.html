<!-- @dsCard group="Status" height=96 subtitle="Ride and booking states, always with a word" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root"></div>
<script>
var C = window.Carona, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'cr-preview' },
    ['scheduled', 'in_progress', 'completed', 'cancelled', 'confirmed', 'full'].map(function (s) { return h(C.StatusBadge, { key: s, status: s }); }))
);
</script>
</body>
</html>
