<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Carona</title>
<style>
  html, body { margin: 0; background: var(--surface); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--surface); }
  .cover svg { position: absolute; inset: 0; }
  .brand { fill: var(--brand); }
  .ink { fill: var(--ink); }
  .marking { fill: var(--marking); }
  .tint { fill: var(--brand-soft); }
  .ground { fill: var(--surface); }
  .ring { fill: var(--surface); stroke: var(--brand); stroke-width: 4px; }
  .slab { rx: var(--radius-lg); }
  .dash { rx: 4px; }
  .text { position: absolute; left: 40px; bottom: 40px; max-width: 440px; display: flex; flex-direction: column; gap: var(--space-2); }
  .name { margin: 0; font: 700 120px/0.92 var(--font-display); letter-spacing: -0.03em; color: var(--ink); }
  .tag { margin: 0; font: 500 14px/20px var(--font-sans); color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <!--
    blocks: brand slab 360x240 (bleeds off top), ink block 192x112, marking block 224x72 (bleeds off bottom-right), brand-soft tint 72x104; corners radius-lg.
    arrangement: one tall slab with satellites, staggered down to the bottom-right corner.
    pattern: literal motif, the route line: a hollow origin ring on the tint, a lane of seven marking pills (32x8, gap 16 = space-4) across the slab, a filled destination disc. Carona is about getting from one stop to another, and the dashed lane is the system's RouteLine.
    scales: pitch 48 (space-12), gap 16 (space-4), pill height 8 (space-2), radius-lg on blocks, half the short side on pills.
  -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect class="brand slab" x="600" y="-16" width="360" height="232" />
    <rect class="tint slab" x="504" y="56" width="72" height="104" />
    <rect class="ink slab" x="504" y="184" width="192" height="112" />
    <rect class="marking slab" x="728" y="232" width="248" height="84" />
    <circle class="ring" cx="540" cy="108" r="12" />
    <rect class="marking dash" x="616" y="104" width="32" height="8" />
    <rect class="marking dash" x="664" y="104" width="32" height="8" />
    <rect class="marking dash" x="712" y="104" width="32" height="8" />
    <rect class="marking dash" x="760" y="104" width="32" height="8" />
    <rect class="marking dash" x="808" y="104" width="32" height="8" />
    <rect class="marking dash" x="856" y="104" width="32" height="8" />
    <circle class="ground" cx="916" cy="108" r="12" />
  </svg>
  <div class="text">
    <h1 class="name">Carona</h1>
    <p class="tag">Shared rides across Lagos, designed for the phone in your hand.</p>
  </div>
</div>
</body>
</html>
