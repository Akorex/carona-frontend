<!-- @dsCard group="Identity" height=170 subtitle="24px grid, 2px stroke, currentColor" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root"></div>
<script>
var C = window.Carona, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'cr-preview', style: { gap: 'var(--space-4)' } },
    C.iconNames.map(function (n) {
      return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px', width: '64px' } },
        h(C.Icon, { name: n, size: 24 }),
        h('span', { style: { font: '500 11px/14px var(--font-mono)', color: 'var(--ink-muted)' } }, n));
    }))
);
</script>
</body>
</html>
