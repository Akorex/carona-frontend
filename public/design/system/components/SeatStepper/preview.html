<!-- @dsCard group="Forms" height=120 subtitle="Choose seats, capped at seats left" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root"></div>
<script>
var C = window.Carona, h = React.createElement;
function Demo() {
  var s = React.useState(2);
  return h('div', { className: 'cr-preview cr-preview--col' },
    h(C.SeatStepper, { id: 'seats', value: s[0], max: 3, onChange: s[1] }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
