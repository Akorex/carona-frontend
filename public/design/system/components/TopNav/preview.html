<!doctype html>
<html>
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<div id="root"></div>
<script>
var C = window.Carona, h = React.createElement;
function Demo() {
  var s = React.useState('find');
  function nav(id, e) { e.preventDefault(); if (id === 'find' || id === 'trips' || id === 'offer' || id === 'profile') s[1](id); }
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '24px', padding: '16px 0' } },
    h(C.TopNav, { user: { first_name: 'Tunde', last_name: 'Bakare' }, active: s[0], onNavigate: nav }),
    h(C.TopNav, { onNavigate: function (id, e) { e.preventDefault(); } }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
