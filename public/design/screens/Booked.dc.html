<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Booking confirmed</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Was claude.ai's support.js; dc-lite renders this file in any browser. -->
<script src="../runtime/react.production.min.js"></script>
<script src="../runtime/react-dom.production.min.js"></script>
<link rel="stylesheet" href="../system/tokens.css">
<link rel="stylesheet" href="../system/components/bundle.css">
<link rel="stylesheet" href="../runtime/viewer.css">
<script src="../system/components/bundle.js"></script>
<script src="../runtime/dc-lite.js"></script>
<script src="../runtime/manifest.js"></script>
<script src="../runtime/viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
  <dc-import name="TopNav" active="trips" hint-size="100%,72px"></dc-import>
  <main style="width: 100%; max-width: 640px; margin: 0 auto; box-sizing: border-box; padding: 48px 32px 64px; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px;">
      <span style="display: grid; place-items: center; width: 56px; height: 56px; border-radius: 999px; background: var(--success-soft); color: var(--success);">
        <x-import component-from-global-scope="Carona.Icon" name="check" size="{{big}}"></x-import>
      </span>
      <h1 class="title-lg" style="margin: 0; font-size: 32px; line-height: 38px;">You're booked</h1>
      <p class="body-lg" style="margin: 0; color: var(--ink-muted);">2 seats with Femi on Thu 12 Nov. Be at the pickup point a few minutes early.</p>
    </div>

    <section style="display: flex; flex-direction: column; gap: 20px; padding: 24px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
        <span class="label" style="color: var(--ink-muted);">Thu 12 Nov</span>
        <x-import component-from-global-scope="Carona.StatusBadge" status="confirmed"></x-import>
      </div>
      <x-import component-from-global-scope="Carona.RouteLine" origin="Ikeja City Mall, main gate" destination="Victoria Island, Adeola Odeku St" departure="2026-11-12T07:30:00" arrival="2026-11-12T08:45:00"></x-import>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 10px; background: var(--brand-soft);">
        <span class="label" style="color: var(--brand);">Look for this car</span>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: #8b9095; border: 1px solid var(--line-strong);"></span>
          <span class="body-strong">Grey Toyota Corolla</span>
          <x-import component-from-global-scope="Carona.PlateNumber">KSF 318 BD</x-import>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 16px; border-top: 1px solid var(--line);">
        <span class="body" style="color: var(--ink-muted);">2 seats × ₦2,500, paid to Femi in cash</span>
        <span class="fare">₦5,000</span>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 12px;">
      <a href="Trips.dc.html" class="cr-btn cr-btn--primary cr-btn--md" style="text-decoration: none;">See my trips</a>
      <x-import component-from-global-scope="Carona.Button" variant="danger-ghost">Cancel booking</x-import>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', big: 28 };
  }
}
</script>
</body>
</html>
