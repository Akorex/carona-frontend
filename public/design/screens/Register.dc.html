<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create account</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Was claude.ai's support.js; dc-lite renders this file in any browser. -->
<script src="../runtime/react.production.min.js"></script>
<script src="../runtime/react-dom.production.min.js"></script>
<link rel="stylesheet" href="../system/tokens.css">
<link rel="stylesheet" href="../system/components/bundle.css">
<link rel="stylesheet" href="../runtime/viewer.css">
<script src="../system/components/bundle.js"></script>
<script src="../runtime/dc-lite.js"></script>
<script src="../runtime/manifest.js"></script>
<script src="../runtime/viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
  <dc-import name="TopNav" signed-in="{{no}}" active="none" hint-size="100%,72px"></dc-import>
  <main style="width: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box; padding: 56px 32px 64px; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 class="title-lg" style="margin: 0; font-size: 32px; line-height: 38px;">Create your account</h1>
      <p class="body" style="margin: 0; color: var(--ink-muted);">One account lets you book seats and, once you add a car, offer rides.</p>
    </div>
    <form style="display: flex; flex-direction: column; gap: 20px; padding: 32px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px;">
        <x-import component-from-global-scope="Carona.TextField" id="first" label="First name" default-value="Chiamaka" auto-complete="given-name"></x-import>
        <x-import component-from-global-scope="Carona.TextField" id="last" label="Last name" default-value="Obi" auto-complete="family-name"></x-import>
      </div>
      <x-import component-from-global-scope="Carona.TextField" id="email" label="Email" type="email" default-value="chiamaka.obi@mail.ng" auto-complete="email"></x-import>
      <x-import component-from-global-scope="Carona.TextField" id="phone" label="Phone number" optional="{{yes}}" type="tel" placeholder="0803 123 4567" hint="Drivers use it to reach you at pickup."></x-import>
      <x-import component-from-global-scope="Carona.TextField" id="password" label="Password" type="password" default-value="secret12" hint="At least 6 characters." auto-complete="new-password"></x-import>
      <x-import component-from-global-scope="Carona.Button" type="submit" block="{{yes}}">Create account</x-import>
    </form>
    <p class="body" style="margin: 0; text-align: center; color: var(--ink-muted);">Already have an account? <a href="SignIn.dc.html" style="font-weight: 600;">Sign in</a></p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', yes: true, no: false };
  }
}
</script>
</body>
</html>
