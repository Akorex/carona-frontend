<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My vehicles, loading</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Was claude.ai's support.js; dc-lite renders this file in any browser. -->
<script src="../runtime/react.production.min.js"></script>
<script src="../runtime/react-dom.production.min.js"></script>
<link rel="stylesheet" href="../system/tokens.css">
<link rel="stylesheet" href="../system/components/bundle.css">
<link rel="stylesheet" href="../runtime/viewer.css">
<script src="../system/components/bundle.js"></script>
<script src="../runtime/dc-lite.js"></script>
<script src="../runtime/manifest.js"></script>
<script src="../runtime/viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
  <dc-import name="TopNav" active="profile" hint-size="100%,72px"></dc-import>
  <main aria-busy="true" style="width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 40px 32px 64px; display: flex; flex-direction: column; gap: 24px;">
    <p class="cr-sr">Loading your vehicles</p>
    <a href="Profile.dc.html" class="label" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none; align-self: flex-start;">
      <x-import component-from-global-scope="Carona.Icon" name="arrow-left" size="{{small}}"></x-import>Profile
    </a>
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h1 class="title-lg" style="margin: 0; font-size: 32px; line-height: 38px;">My vehicles</h1>
        <p class="body" style="margin: 0; color: var(--ink-muted);">Passengers see the colour, model and plate once they book, so they can find you at pickup.</p>
      </div>
      <a href="AddVehicle.dc.html" class="cr-btn cr-btn--secondary cr-btn--md" style="text-decoration: none;">
        <x-import component-from-global-scope="Carona.Icon" name="plus"></x-import>Add vehicle
      </a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px;">
      <x-import component-from-global-scope="Carona.Skeleton" variant="card"></x-import>
      <x-import component-from-global-scope="Carona.Skeleton" variant="card"></x-import>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', small: 16 };
  }
}
</script>
</body>
</html>
