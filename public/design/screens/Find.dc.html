<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find a ride</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Was claude.ai's support.js; dc-lite renders this file in any browser. -->
<script src="../runtime/react.production.min.js"></script>
<script src="../runtime/react-dom.production.min.js"></script>
<link rel="stylesheet" href="../system/tokens.css">
<link rel="stylesheet" href="../system/components/bundle.css">
<link rel="stylesheet" href="../runtime/viewer.css">
<script src="../system/components/bundle.js"></script>
<script src="../runtime/dc-lite.js"></script>
<script src="../runtime/manifest.js"></script>
<script src="../runtime/viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
  <dc-import name="TopNav" active="find" hint-size="100%,72px"></dc-import>
  <main style="width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 64px 32px; display: flex; flex-direction: column; gap: 48px;">
    <section style="display: flex; flex-direction: column; gap: 24px;">
      <h1 class="display" style="margin: 0; font-size: 48px; line-height: 52px; letter-spacing: -0.03em;">Where are you going, Tunde?</h1>
      <form style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); align-items: end; gap: 16px; padding: 24px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-card);">
        <x-import component-from-global-scope="Carona.TextField" id="from" label="From" placeholder="Ikeja City Mall"></x-import>
        <x-import component-from-global-scope="Carona.TextField" id="to" label="To" placeholder="Victoria Island"></x-import>
        <x-import component-from-global-scope="Carona.TextField" id="date" label="Day" type="date" default-value="2026-11-12"></x-import>
        <a href="Results.dc.html" class="cr-btn cr-btn--primary cr-btn--md cr-btn--block" style="text-decoration: none;">
          <x-import component-from-global-scope="Carona.Icon" name="search"></x-import>Search rides
        </a>
      </form>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px;">
      <h2 class="title-md" style="margin: 0;">Recent searches</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px;">
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
          <a href="Results.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 16px; box-sizing: border-box; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; color: var(--ink); text-decoration: none;">
            <span style="display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 999px; background: var(--surface-sunken); color: var(--ink-muted);">
              <x-import component-from-global-scope="Carona.Icon" name="clock"></x-import>
            </span>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
              <span class="body-strong">{{r.route}}</span>
              <span class="caption" style="color: var(--ink-muted);">{{r.when}}</span>
            </span>
            <x-import component-from-global-scope="Carona.Icon" name="chevron-right"></x-import>
          </a>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      recent: [
        { route: 'Ikeja City Mall to Victoria Island', when: 'Weekday mornings' },
        { route: 'Lekki Phase 1 to Yaba', when: 'Last searched Fri 6 Nov' },
        { route: 'Ajah to Marina', when: 'Last searched Mon 2 Nov' }
      ]
    };
  }
}
</script>
</body>
</html>
