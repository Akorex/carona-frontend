<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My trips</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Was claude.ai's support.js; dc-lite renders this file in any browser. -->
<script src="../runtime/react.production.min.js"></script>
<script src="../runtime/react-dom.production.min.js"></script>
<link rel="stylesheet" href="../system/tokens.css">
<link rel="stylesheet" href="../system/components/bundle.css">
<link rel="stylesheet" href="../runtime/viewer.css">
<script src="../system/components/bundle.js"></script>
<script src="../runtime/dc-lite.js"></script>
<script src="../runtime/manifest.js"></script>
<script src="../runtime/viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
  <dc-import name="TopNav" active="trips" hint-size="100%,72px"></dc-import>
  <main style="width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 40px 32px 64px; display: flex; flex-direction: column; gap: 40px;">
    <h1 class="title-lg" style="margin: 0; font-size: 32px; line-height: 38px;">My trips</h1>

    <section style="display: flex; flex-direction: column; gap: 16px;">
      <h2 class="title-md" style="margin: 0;">Upcoming</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 24px;">
        <sc-for list="{{upcoming}}" as="t" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
              <span style="display: inline-flex; align-items: center; gap: 6px;" class="label">
                <x-import component-from-global-scope="Carona.Icon" name="{{t.icon}}" size="{{small}}"></x-import>{{t.role}}
              </span>
              <x-import component-from-global-scope="Carona.StatusBadge" status="{{t.badge}}"></x-import>
            </div>
            <a href="{{t.href}}" style="display: block; border-radius: 16px; color: inherit; text-decoration: none; box-shadow: var(--shadow-card);">
              <x-import component-from-global-scope="Carona.RideCard" ride="{{t.ride}}"></x-import>
            </a>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 16px;">
      <h2 class="title-md" style="margin: 0;">Past</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 24px;">
        <sc-for list="{{past}}" as="t" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <span style="display: inline-flex; align-items: center; gap: 6px; min-height: 24px;" class="label">
              <x-import component-from-global-scope="Carona.Icon" name="{{t.icon}}" size="{{small}}"></x-import>{{t.role}}
            </span>
            <x-import component-from-global-scope="Carona.RideCard" ride="{{t.ride}}"></x-import>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const femi = { first_name: 'Femi', last_name: 'Adebayo' };
    const tunde = { first_name: 'Tunde', last_name: 'Bakare' };
    const grey = { make: 'Toyota', model: 'Corolla', colour: 'Grey' };
    const silver = { make: 'Toyota', model: 'Corolla', colour: 'Silver' };
    return {
      theme: this.props.theme ?? 'light',
      small: 16,
      upcoming: [
        { role: 'Passenger · 2 seats', icon: 'ticket', badge: 'confirmed', href: 'Booked.dc.html',
          ride: { id: 'b1', origin: 'Ikeja City Mall', destination: 'Victoria Island', departure_time: '2026-11-12T07:30:00', arrival_time: '2026-11-12T08:45:00', fare: 2500, status: 'scheduled', driver: femi, vehicle: grey } },
        { role: 'Driving · 3 of 4 seats booked', icon: 'steering', badge: 'scheduled', href: 'DriverRide.dc.html',
          ride: { id: 'd1', origin: 'Ikeja City Mall', destination: 'Victoria Island', departure_time: '2026-11-13T07:30:00', arrival_time: '2026-11-13T08:45:00', fare: 2500, seats_left: 1, status: 'scheduled', driver: tunde, vehicle: silver } }
      ],
      past: [
        { role: 'Passenger · 1 seat', icon: 'ticket',
          ride: { id: 'p1', origin: 'Lekki Phase 1', destination: 'Yaba', departure_time: '2026-11-09T17:15:00', arrival_time: '2026-11-09T18:40:00', fare: 1800, status: 'completed',
            driver: { first_name: 'Chiamaka', last_name: 'Obi' }, vehicle: { make: 'Honda', model: 'Civic', colour: 'Black' } } },
        { role: 'Driving', icon: 'steering',
          ride: { id: 'p2', origin: 'Ikeja City Mall', destination: 'Victoria Island', departure_time: '2026-11-06T07:30:00', arrival_time: null, fare: 2500, status: 'cancelled', driver: tunde, vehicle: silver } }
      ]
    };
  }
}
</script>
</body>
</html>
