<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Was claude.ai's support.js; dc-lite renders this file in any browser. -->
<script src="../runtime/react.production.min.js"></script>
<script src="../runtime/react-dom.production.min.js"></script>
<link rel="stylesheet" href="../system/tokens.css">
<link rel="stylesheet" href="../system/components/bundle.css">
<link rel="stylesheet" href="../runtime/viewer.css">
<script src="../system/components/bundle.js"></script>
<script src="../runtime/dc-lite.js"></script>
<script src="../runtime/manifest.js"></script>
<script src="../runtime/viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
  <dc-import name="TopNav" active="profile" hint-size="100%,72px"></dc-import>
  <main style="width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 48px 32px 64px; display: flex; flex-direction: column; gap: 32px;">
    <h1 class="title-lg" style="margin: 0; font-size: 32px; line-height: 38px;">Profile</h1>
    <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px;">
      <section style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; padding: 32px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px;">
        <x-import component-from-global-scope="Carona.Avatar" name="Tunde Bakare" size="lg"></x-import>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h2 class="title-lg" style="margin: 0;">Tunde Bakare</h2>
          <p class="body" style="margin: 0; color: var(--ink-muted);">Member since Oct 2026</p>
        </div>
        <x-import component-from-global-scope="Carona.Button" variant="danger-ghost" icon="log-out" size="sm">Sign out</x-import>
      </section>

      <div style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
        <section style="display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <h3 class="title-md" style="margin: 0;">Contact</h3>
            <a href="EditProfile.dc.html" class="cr-btn cr-btn--ghost cr-btn--sm" style="min-height: 48px;">
              <x-import component-from-global-scope="Carona.Icon" name="pencil" size="{{small}}"></x-import>Edit details
            </a>
          </div>
          <dl style="margin: 0; display: flex; flex-direction: column; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px;">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 16px 20px; border-bottom: 1px solid var(--line);">
              <dt class="body" style="color: var(--ink-muted);">Email</dt>
              <dd class="body-strong" style="margin: 0; overflow-wrap: anywhere;">tunde.bakare@mail.ng</dd>
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 16px 20px;">
              <dt class="body" style="color: var(--ink-muted);">Phone</dt>
              <dd class="body-strong" style="margin: 0;">0803 555 0142</dd>
            </div>
          </dl>
        </section>

        <section style="display: flex; flex-direction: column; gap: 12px;">
          <h3 class="title-md" style="margin: 0;">Driving</h3>
          <a href="Vehicles.dc.html" style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 0 20px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; color: var(--ink); text-decoration: none;">
            <span style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; background: var(--brand-soft); color: var(--brand);">
              <x-import component-from-global-scope="Carona.Icon" name="car"></x-import>
            </span>
            <span style="flex-grow: 1; display: flex; flex-direction: column;">
              <span class="body-strong">My vehicles</span>
              <span class="caption" style="color: var(--ink-muted);">2 vehicles</span>
            </span>
            <x-import component-from-global-scope="Carona.Icon" name="chevron-right"></x-import>
          </a>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', small: 16 };
  }
}
</script>
</body>
</html>
