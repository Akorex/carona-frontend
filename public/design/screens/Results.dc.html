<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search results</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Was claude.ai's support.js; dc-lite renders this file in any browser. -->
<script src="../runtime/react.production.min.js"></script>
<script src="../runtime/react-dom.production.min.js"></script>
<link rel="stylesheet" href="../system/tokens.css">
<link rel="stylesheet" href="../system/components/bundle.css">
<link rel="stylesheet" href="../runtime/viewer.css">
<script src="../system/components/bundle.js"></script>
<script src="../runtime/dc-lite.js"></script>
<script src="../runtime/manifest.js"></script>
<script src="../runtime/viewer.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
  <dc-import name="TopNav" active="find" hint-size="100%,72px"></dc-import>
  <main style="width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 28px;">
    <form style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); align-items: end; gap: 16px; padding: 20px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px;">
      <x-import component-from-global-scope="Carona.TextField" id="from" label="From" default-value="Ikeja City Mall"></x-import>
      <x-import component-from-global-scope="Carona.TextField" id="to" label="To" default-value="Victoria Island"></x-import>
      <x-import component-from-global-scope="Carona.TextField" id="date" label="Day" type="date" default-value="2026-11-12"></x-import>
      <a href="Results.dc.html" class="cr-btn cr-btn--secondary cr-btn--md cr-btn--block" style="text-decoration: none;">
        <x-import component-from-global-scope="Carona.Icon" name="search"></x-import>Update search
      </a>
    </form>

    <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px;">
      <h1 class="title-lg" style="margin: 0;">4 rides on Thu 12 Nov</h1>
      <p class="body" style="margin: 0; color: var(--ink-muted);">Earliest departure first</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px;">
      <sc-for list="{{rides}}" as="r" hint-placeholder-count="4">
        <a href="RideDetail.dc.html" aria-label="{{r.label}}" style="display: block; border-radius: 16px; color: inherit; text-decoration: none; box-shadow: var(--shadow-card);">
          <x-import component-from-global-scope="Carona.RideCard" ride="{{r}}"></x-import>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { origin: 'Ikeja City Mall', destination: 'Victoria Island, Adeola Odeku St', status: 'scheduled' };
    const rides = [
      { ...base, id: 'r1', departure_time: '2026-11-12T06:45:00', arrival_time: '2026-11-12T08:05:00', fare: 2200, seats_left: 1,
        driver: { first_name: 'Kemi', last_name: 'Adeyemi' }, vehicle: { make: 'Kia', model: 'Rio', colour: 'Red' } },
      { ...base, id: 'r2', departure_time: '2026-11-12T07:30:00', arrival_time: '2026-11-12T08:45:00', fare: 2500, seats_left: 3,
        driver: { first_name: 'Femi', last_name: 'Adebayo' }, vehicle: { make: 'Toyota', model: 'Corolla', colour: 'Grey' } },
      { ...base, id: 'r3', departure_time: '2026-11-12T08:00:00', arrival_time: null, fare: 2000, seats_left: 0,
        driver: { first_name: 'Emeka', last_name: 'Nwosu' }, vehicle: { make: 'Toyota', model: 'Camry', colour: 'Black' } },
      { ...base, id: 'r4', origin: 'Ikeja, Allen Avenue', departure_time: '2026-11-12T08:20:00', arrival_time: '2026-11-12T09:40:00', fare: 2800, seats_left: 2,
        driver: { first_name: 'Halima', last_name: 'Musa' }, vehicle: { make: 'Honda', model: 'Accord', colour: 'White' } }
    ];
    return {
      theme: this.props.theme ?? 'light',
      rides: rides.map((r) => ({ ...r, label: 'Ride with ' + r.driver.first_name + ', see details' }))
    };
  }
}
</script>
</body>
</html>
